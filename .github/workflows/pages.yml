name: Deploy UI to GitHub Pages

on:
  push:
    branches: ['**']   # any branch; the last deploy wins (Pages has one site)
    paths: ['public/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The UI is static HTML/JS, so "build" means assembling the public/ folder.
      # The Node server is NOT deployed here; it runs on your own network.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r public/. _site/
          test -f _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
